# Render Blueprint for a FREE-TIER TEST deployment of Vuna Fresh.
# Not for real customers. Free-tier limits that affect testing:
#   - Uploaded files (product photos, proof of payment) go to Supabase Storage
#     once the STORAGE_* variables below are set in the dashboard. Until then
#     they're kept on the API server's disk and wiped on every deploy and restart.
#   - Services sleep after 15 minutes idle; the first request then takes ~1 minute.
#   - The free database is deleted after 30 days.
#   - There is no Shell, so the first admin is created during the build from
#     DJANGO_SUPERUSER_* below (skipped once it exists).
#
# Addresses. The website and the API each need the other's exact address, and a
# Blueprint cannot pass a public address from one service to another, so both
# are written out below:
#   API      https://vunafresh-api.onrender.com
#   Website  https://vunafresh.onrender.com
# Render only gives a service its name as its address while nobody else on
# onrender.com holds it; otherwise it adds a random suffix (vunafresh-web became
# vunafresh-web-8mmw because a suspended service still holds vunafresh-web).
# After creating the Blueprint, check both addresses in the dashboard. If either
# has a suffix, change every address below to match, push, and Sync.
#
# Create this Blueprint ONCE. Each new Blueprint makes another copy of every
# service, and the copies get suffixed addresses. To change settings later, edit
# this file, push, and use the existing Blueprint's Sync.

databases:
  - name: vunafresh-db
    plan: free
    region: frankfurt
    databaseName: vunafresh
    user: vunafresh

services:
  - type: web
    name: vunafresh-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate --noinput &&
      (python manage.py createsuperuser --noinput || echo "Admin already exists, skipping")
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: vunafresh-db
          property: connectionString

      # The website's address: the only site allowed to call this API.
      - key: CORS_ALLOWED_ORIGINS
        value: https://vunafresh.onrender.com
      # Used for links in emails (password reset, order updates).
      - key: FRONTEND_URL
        value: https://vunafresh.onrender.com

      # First admin account, created on the first deploy. You choose the password.
      - key: DJANGO_SUPERUSER_EMAIL
        value: gamugusto@gmail.com
      - key: DJANGO_SUPERUSER_FIRST_NAME
        value: Gamu
      - key: DJANGO_SUPERUSER_LAST_NAME
        value: Gusto
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

      # Payments: EFT / direct deposit only. PayFast stays off.
      - key: PAYFAST_ENABLED
        value: "False"
      # Test account shown to buyers at checkout. Swap for the Vuna Fresh account before launch.
      - key: PLATFORM_BANK_NAME
        value: FNB
      - key: PLATFORM_BANK_ACCOUNT_HOLDER
        value: Hexx Digital Orbit
      - key: PLATFORM_BANK_ACCOUNT_NUMBER
        value: "63201202411"
      - key: PLATFORM_BANK_BRANCH_CODE
        value: "250655"
      - key: PLATFORM_BANK_ACCOUNT_TYPE
        value: Cheque/Current

      # Email is not set up: emails are written to this service's logs instead
      # of being sent. To send real email later, add EMAIL_HOST, EMAIL_HOST_USER
      # and EMAIL_HOST_PASSWORD in the dashboard (e.g. Brevo's free SMTP).

      # File storage: Supabase Storage (S3-compatible). Set these in the
      # dashboard, on this service's Environment page. Until STORAGE_BUCKET_NAME
      # is set, uploads go to this server's disk and are wiped on every deploy.
      - key: STORAGE_ENDPOINT_URL      # https://<project-ref>.storage.supabase.co/storage/v1/s3
        sync: false
      - key: STORAGE_REGION            # the project's region, e.g. eu-central-1
        sync: false
      - key: STORAGE_BUCKET_NAME       # vunafresh
        sync: false
      - key: STORAGE_PUBLIC_DOMAIN     # <project-ref>.supabase.co/storage/v1/object/public/vunafresh
        sync: false
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: STORAGE_ADDRESSING_STYLE
        value: path

  - type: web
    name: vunafresh
    runtime: node
    plan: free
    region: frankfurt
    rootDir: web
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      # The API's address. Baked in at build time, so redeploy this service after changing it.
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://vunafresh-api.onrender.com/api/v1
