# Render Blueprint for a FREE-TIER TEST deployment of Vuna Fresh.
# Not for real customers. Free-tier limits that affect testing:
#   - Uploaded files (product photos, proof of payment) are kept on the API
#     server's disk and are wiped on every deploy and restart.
#   - Services sleep after 15 minutes idle; the first request then takes ~1 minute.
#   - The free database is deleted after 30 days.
#   - There is no Shell, so the first admin is created during the build from
#     DJANGO_SUPERUSER_* below (skipped once it exists).
#
# Create this Blueprint ONCE. Each new Blueprint makes another copy of every
# service with a new random suffix. To change settings later, edit this file,
# push, and use the existing Blueprint's Sync.

databases:
  - name: vunafresh-db
    plan: free
    databaseName: vunafresh
    user: vunafresh

services:
  - type: web
    name: vunafresh-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate --noinput &&
      (python manage.py createsuperuser --noinput || echo "Admin already exists, skipping")
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: vunafresh-db
          property: connectionString

      # Which website addresses may call this API. Render adds a random suffix
      # when a name is taken (vunafresh-web-8mmw, vunafresh-web-20qr, ...), so
      # any vunafresh-web address on onrender.com is allowed.
      - key: CORS_ALLOWED_ORIGIN_REGEXES
        value: ^https://vunafresh-web(-[a-z0-9]+)?\.onrender\.com$
      - key: CSRF_TRUSTED_ORIGINS
        value: https://vunafresh-web-20qr.onrender.com
      # Used for links in emails (password reset, order updates). Set to the
      # website address you actually use.
      - key: FRONTEND_URL
        value: https://vunafresh-web-20qr.onrender.com

      # First admin account, created on the first deploy. You choose the password.
      - key: DJANGO_SUPERUSER_EMAIL
        value: gamugusto@gmail.com
      - key: DJANGO_SUPERUSER_FIRST_NAME
        value: Gamu
      - key: DJANGO_SUPERUSER_LAST_NAME
        value: Gusto
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

      # Payments: EFT / direct deposit only. PayFast stays off.
      - key: PAYFAST_ENABLED
        value: "False"
      # Test account shown to buyers at checkout. Swap for the Vuna Fresh account before launch.
      - key: PLATFORM_BANK_NAME
        value: FNB
      - key: PLATFORM_BANK_ACCOUNT_HOLDER
        value: Hexx Digital Orbit
      - key: PLATFORM_BANK_ACCOUNT_NUMBER
        value: "63201202411"
      - key: PLATFORM_BANK_BRANCH_CODE
        value: "250655"
      - key: PLATFORM_BANK_ACCOUNT_TYPE
        value: Cheque/Current

      # Email is not set up: emails are written to this service's logs instead
      # of being sent. To send real email later, add EMAIL_HOST, EMAIL_HOST_USER
      # and EMAIL_HOST_PASSWORD in the dashboard (e.g. Brevo's free SMTP).
      #
      # File storage: no R2 variables, so uploads go to this server's disk.

  - type: web
    name: vunafresh-web
    runtime: node
    plan: free
    rootDir: web
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      # The API's address. Baked in at build time, so redeploy this service after changing it.
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://vunafresh-api.onrender.com/api/v1
